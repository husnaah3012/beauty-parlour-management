<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Beauty Parlour - Demo Payment</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .payment-box {
            background: white;
            width: 100%;
            max-width: 420px;
            margin: auto;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 20px;
        }

        .qr-image {
            width: 250px;
            height: 250px;
            margin: 20px auto;
            display: block;
        }

        .description {
            color: #555;
            margin-bottom: 20px;
        }

        .demo-box {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            color: #664d03;
        }

        .transaction-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .payment-button {
            width: 100%;
            padding: 13px;
            background: black;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .payment-button:hover {
            background: #333;
        }

        #paymentMessage {
            margin-top: 20px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .logout-button {
            margin-top: 15px;
            background: #dc3545;
        }

        .logout-button:hover {
            background: #b02a37;
        }

    </style>

</head>


<body>


    <div class="payment-box">

        <h1>Beauty Parlour</h1>

        <h2>Scan to Pay</h2>


        <!-- QR CODE -->

        <img
            class="qr-image"
            src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=BEAUTY-PARLOUR-DEMO-PAYMENT"
            alt="Demo Payment QR Code"
        >


        <p class="description">
            Scan this QR code for demo payment
        </p>


        <!-- DEMO MESSAGE -->

        <div class="demo-box">

            <strong>Demo Payment Only</strong>

            <br>

            No real money will be transferred.

        </div>


        <!-- TRANSACTION ID -->

        <input
            type="text"
            id="transactionId"
            class="transaction-input"
            placeholder="Enter Transaction ID"
        >


        <!-- PAYMENT BUTTON -->

        <button
            class="payment-button"
            onclick="makePayment()"
        >
            Confirm Demo Payment
        </button>


        <!-- LOGOUT -->

        <button
            class="payment-button logout-button"
            onclick="logout()"
        >
            Logout
        </button>


        <!-- RESULT -->

        <p id="paymentMessage"></p>

    </div>



    <script>


        /*
         * Get JWT token from localStorage
         */

        const token =
            localStorage.getItem("token");


        /*
         * Current appointment ID
         */

        const appointmentId =
            "6ab236c27f6ca4fa87d84c61";


        /*
         * Check login
         */

        if (!token) {

            alert(
                "Please login first."
            );

            window.location.href =
                "login.html";
        }



        async function makePayment() {

            const transactionId =
                document
                    .getElementById("transactionId")
                    .value
                    .trim();


            const message =
                document.getElementById(
                    "paymentMessage"
                );


            /*
             * Validate Transaction ID
             */

            if (!transactionId) {

                message.innerText =
                    "Please enter Transaction ID";

                message.className =
                    "error";

                return;
            }


            try {

                const response =
                    await fetch(

                        `http://localhost:5000/api/appointments/${appointmentId}/payment`,

                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`

                            },

                            body: JSON.stringify({

                                transactionId:
                                    transactionId

                            })

                        }

                    );


                const data =
                    await response.json();


                console.log(
                    "Payment Response:",
                    data
                );


                /*
                 * SUCCESS
                 */

                if (response.ok) {

                    message.innerText =
                        "✅ Demo Payment Successful!";

                    message.className =
                        "success";


                    console.log(
                        "Appointment:",
                        data.appointment
                    );

                }


                /*
                 * ERROR
                 */

                else {

                    message.innerText =
                        "❌ " +
                        (
                            data.message ||
                            "Payment failed"
                        );

                    message.className =
                        "error";

                }


            } catch (error) {

                console.log(
                    "Payment Error:",
                    error
                );


                message.innerText =
                    "❌ Server error. Please check backend.";

                message.className =
                    "error";

            }

        }



        /*
         * LOGOUT
         */

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "user"
            );


            window.location.href =
                "login.html";

        }


    </script>


</body>

</html>
