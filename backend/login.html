<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Beauty Parlour - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 50px 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: black;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

    </style>

</head>


<body>


    <div class="login-box">

        <h1>Beauty Parlour Login</h1>


        <input
            type="email"
            id="email"
            placeholder="Enter Email"
        >


        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >


        <button onclick="login()">
            Login
        </button>


        <p id="message"></p>

    </div>



    <script>

        async function login() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            const message =
                document.getElementById("message");


            if (!email || !password) {

                message.innerText =
                    "Please enter email and password";

                message.className = "error";

                return;
            }


            try {

                const response = await fetch(
                    "http://localhost:5000/api/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                console.log("Login Response:", data);


                if (!response.ok) {

                    message.innerText =
                        data.message || "Login failed";

                    message.className = "error";

                    return;
                }


                /*
                 * Get JWT token
                 *
                 * Normally backend returns:
                 * data.token
                 */

                const token =
                    data.token ||
                    data.accessToken ||
                    data.user?.token;


                if (!token) {

                    message.innerText =
                        "Login successful, but token was not received.";

                    message.className = "error";

                    console.log(
                        "Full response:",
                        data
                    );

                    return;
                }


                // Save JWT token

                localStorage.setItem(
                    "token",
                    token
                );


                // Save user information if available

                if (data.user) {

                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );
                }


                message.innerText =
                    "Login successful!";

                message.className = "success";


                /*
                 * Redirect to payment page
                 *
                 * If appointmentId already exists
                 * in localStorage, use it.
                 */

                setTimeout(() => {

                    window.location.href =
                        "payment-qr.html";

                }, 1000);


            } catch (error) {

                console.log(
                    "Login Error:",
                    error
                );

                message.innerText =
                    "Server error. Please try again.";

                message.className = "error";

            }

        }

    </script>


</body>

</html>
